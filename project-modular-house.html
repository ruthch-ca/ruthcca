<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modular House Design</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      color: #252;
      line-height: 1.6;
    }
    h1 {
      color: #111;
      margin-bottom: 1.5rem;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: #0969da;
      text-decoration: none;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .project-image {
      display: block;
      width: 100%;
      height: 260px;
      object-fit: cover;
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      background: #f8fafc;
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html">← Back to portfolio</a>
  <h1>Modular House Design</h1>

  <div class="gallery" aria-label="Modular House Design project gallery">
    <img class="project-image" src="img/img-modularTM/revithouse1_ruthc_04.png" alt="Modular House Design image 4">
    <img class="project-image" src="img/img-modularTM/revithouse1_ruthc_02.png" alt="Modular House Design image 2">
    <img class="project-image" src="img/img-modularTM/revithouse1_ruthc_03.png" alt="Modular House Design image 3">
    <img class="project-image" src="img/img-modularTM/revithouse1_ruthc_01.png" alt="Modular House Design image 1">
    <img class="project-image" src="img/img-modularTM/revithouse2_ruthc_01.gif" alt="Modular House Design image 5">
  </div>
</body>
</html>
